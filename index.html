<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Leads Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 { font-size: 1.6rem; color: #38bdf8; }
    .stats {
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .stats strong { color: #38bdf8; }

    .controls {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }
    .upload-area {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #22c55e; color: white; }
    .btn-success:hover { background: #16a34a; }
    .btn-outline {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    .btn-outline:hover { border-color: #94a3b8; color: white; }
    .btn-whatsapp { background: #25d366; color: white; }
    .btn-whatsapp:hover { background: #1da851; }
    .btn-sm { padding: 7px 12px; font-size: 0.8rem; }

    .search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"], select {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      min-width: 180px;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .lead-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #334155;
      transition: 0.2s;
      position: relative;
    }
    .lead-card:hover { border-color: #3b82f6; }
    .lead-card.contacted {
      opacity: 0.65;
      border-color: #22c55e;
    }
    .lead-card.contacted::after {
      content: "✓ Contacted";
      position: absolute;
      top: 12px;
      right: 12px;
      background: #22c55e;
      color: white;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }
    .lead-card.no-wa {
      border-color: #ef4444;
    }
    .lead-card.no-wa:not(.contacted)::after {
      content: "No WhatsApp";
      position: absolute;
      top: 12px;
      right: 12px;
      background: #ef4444;
      color: white;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .lead-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
      padding-right: 90px;
    }
    .lead-meta {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .lead-meta i { width: 16px; display: inline-block; color: #64748b; }
    .lead-phone {
      font-size: 1rem;
      color: #38bdf8;
      font-weight: 600;
      margin: 10px 0;
    }
    .lead-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state h3 { margin-bottom: 10px; color: #94a3b8; }

    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .filter-tab {
      padding: 7px 14px;
      border-radius: 20px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-tab.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.3rem; }
      .leads-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 Real Estate Leads</h1>
      <div class="stats">
        Total: <strong id="totalCount">0</strong> &nbsp;|&nbsp;
        Contacted: <strong id="contactedCount">0</strong>
      </div>
    </header>

    <div class="controls">
      <div class="upload-area">
        <textarea id="jsonInput" placeholder='Paste your Apify JSON array here...
Example:
[
  {
    "title": "John Smith - Realtor",
    "phone": "(916) 715-8286",
    "city": "Sacramento",
    "state": "California",
    "street": "2335 American River Dr"
  }
]'></textarea>
      </div>
      <div class="search-row">
        <button class="btn btn-primary" onclick="loadLeads()">Load Leads</button>
        <button class="btn btn-outline" onclick="clearAll()">Clear All</button>
        <input type="text" id="searchInput" placeholder="Search name / city / phone..." oninput="renderLeads()">
        <select id="filterStatus" onchange="renderLeads()">
          <option value="all">All Leads</option>
          <option value="pending">Not Contacted</option>
          <option value="contacted">Contacted</option>
          <option value="hasWebsite">Has Website</option>
          <option value="noWebsite">No Website</option>
          <option value="noWhatsApp">No WhatsApp</option>
        </select>
      </div>
    </div>

    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">All</div>
      <div class="filter-tab" data-filter="pending" onclick="setFilter('pending')">Pending</div>
      <div class="filter-tab" data-filter="contacted" onclick="setFilter('contacted')">Contacted</div>
    </div>

    <div id="leadsContainer" class="leads-grid">
      <div class="empty-state">
        <h3>No leads loaded</h3>
        <p>Paste your Apify JSON above and click "Load Leads"</p>
      </div>
    </div>
  </div>

  <script>
    let leads = [];
    let contacted = JSON.parse(localStorage.getItem('contactedLeads') || '{}');
    let noWhatsApp = JSON.parse(localStorage.getItem('noWhatsAppLeads') || '{}');

    function cleanPhone(phone) {
      if (!phone) return '';
      
      // Convert to string and remove all non-digits
      let digits = String(phone).replace(/\D/g, '');
      
      // Remove leading zeros
      digits = digits.replace(/^0+/, '');
      
      // US numbers
      if (digits.length === 11 && digits.startsWith('1')) {
        return digits; // already has country code
      }
      if (digits.length === 10) {
        return '1' + digits; // add US country code
      }
      
      // International numbers (already have country code, length 11-15)
      if (digits.length >= 11 && digits.length <= 15) {
        return digits;
      }
      
      // Too short or invalid
      if (digits.length < 10) {
        return '';
      }
      
      return digits;
    }

    function loadLeads() {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) {
        alert('Please paste JSON data first');
        return;
      }
      try {
        let data = JSON.parse(raw);
        if (!Array.isArray(data)) data = [data];
        leads = data.map((item, idx) => {
          // Detect website from common Apify / Google Maps fields
          let website = item.website || item.websiteUrl || item.site || item.web || item.domain || '';
          
          // Sometimes website is inside placeInfo or other nested objects
          if (!website && item.placeInfo) {
            website = item.placeInfo.website || item.placeInfo.websiteUrl || '';
          }

          // If url is not a Google Maps link, treat it as website
          if (!website && item.url && !item.url.includes('google.com/maps') && !item.url.includes('maps.google')) {
            website = item.url;
          }

          return {
            id: idx + '_' + (item.phone || item.title || Math.random()),
            title: item.title || item.name || 'No Name',
            phone: item.phone || '',
            street: item.street || '',
            city: item.city || '',
            state: item.state || '',
            country: item.countryCode || item.country || '',
            url: item.url || '',
            website: website,
            score: item.totalScore || null,
            reviews: item.reviewsCount || null,
            categories: item.categories || []
          };
        });
        // Save to localStorage
        localStorage.setItem('savedLeads', JSON.stringify(leads));
        renderLeads();
        alert(leads.length + ' leads loaded successfully!');
      } catch (e) {
        alert('Invalid JSON. Please check the format.\n\nError: ' + e.message);
      }
    }

    function setFilter(status) {
      document.getElementById('filterStatus').value = status;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.filter-tab[data-filter="${status}"]`).classList.add('active');
      renderLeads();
    }

    function renderLeads() {
      const container = document.getElementById('leadsContainer');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('filterStatus').value;

      let filtered = leads.filter(lead => {
        const isContacted = !!contacted[lead.id];
        const hasWebsite = !!lead.website;
        const isNoWA = !!noWhatsApp[lead.id];

        if (statusFilter === 'contacted' && !isContacted) return false;
        if (statusFilter === 'pending' && isContacted) return false;
        if (statusFilter === 'hasWebsite' && !hasWebsite) return false;
        if (statusFilter === 'noWebsite' && hasWebsite) return false;
        if (statusFilter === 'noWhatsApp' && !isNoWA) return false;

        if (!search) return true;
        const text = (lead.title + ' ' + lead.city + ' ' + lead.state + ' ' + lead.phone + ' ' + lead.street + ' ' + (lead.website || '')).toLowerCase();
        return text.includes(search);
      });

      // Update stats
      const contactedCount = leads.filter(l => contacted[l.id]).length;
      const websiteCount = leads.filter(l => l.website).length;
      document.getElementById('totalCount').textContent = leads.length;
      document.getElementById('contactedCount').textContent = contactedCount;
      const statsEl = document.querySelector('.stats');
      if (statsEl) {
        statsEl.innerHTML = `Total: <strong>${leads.length}</strong> &nbsp;|&nbsp; Contacted: <strong>${contactedCount}</strong> &nbsp;|&nbsp; Has Website: <strong>${websiteCount}</strong>`;
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>${leads.length === 0 ? 'No leads loaded' : 'No matching leads'}</h3>
            <p>${leads.length === 0 ? 'Paste your Apify JSON above and click "Load Leads"' : 'Try changing search or filter'}</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(lead => {
        const isContacted = !!contacted[lead.id];
        const isNoWA = !!noWhatsApp[lead.id];
        const clean = cleanPhone(lead.phone);
        const waLink = clean ? `https://wa.me/${clean}` : null;
        const location = [lead.street, lead.city, lead.state].filter(Boolean).join(', ');

        const hasWebsite = !!lead.website;
        const websiteBadge = hasWebsite 
          ? `<span style="background:#22c55e;color:white;font-size:0.7rem;padding:2px 8px;border-radius:10px;margin-left:6px;">Has Website</span>`
          : `<span style="background:#ef4444;color:white;font-size:0.7rem;padding:2px 8px;border-radius:10px;margin-left:6px;">No Website</span>`;

        let phoneDisplay = '';
        if (!lead.phone) {
          phoneDisplay = `<span style="color:#f87171">No phone number</span>`;
        } else if (isNoWA) {
          phoneDisplay = `<span style="color:#f87171;font-weight:700;">${lead.phone} — No WhatsApp</span>`;
        } else if (!clean) {
          phoneDisplay = `<span style="color:#f87171">${lead.phone} (invalid)</span>`;
        } else {
          phoneDisplay = lead.phone;
        }

        return `
          <div class="lead-card ${isContacted ? 'contacted' : ''} ${isNoWA ? 'no-wa' : ''}" id="card-${lead.id}">
            <div class="lead-name">${escapeHtml(lead.title)} ${websiteBadge}</div>
            <div class="lead-meta">${location || 'No address'}</div>
            ${lead.reviews ? `<div class="lead-meta">⭐ ${lead.score || '-'} · ${lead.reviews} reviews</div>` : ''}
            <div class="lead-phone">${phoneDisplay}</div>
            ${hasWebsite ? `<div class="lead-meta" style="color:#38bdf8;word-break:break-all;">🌐 ${escapeHtml(lead.website)}</div>` : ''}
            <div class="lead-actions">
              ${waLink && !isNoWA
                ? `<a href="${waLink}" target="_blank" class="btn btn-whatsapp btn-sm">WhatsApp</a>` 
                : `<button class="btn btn-outline btn-sm" disabled style="opacity:0.5;cursor:not-allowed;background:#7f1d1d;color:#fca5a5;border-color:#7f1d1d;">No WhatsApp</button>`
              }
              ${lead.phone ? `<button class="btn btn-outline btn-sm" onclick="copyPhone('${String(lead.phone).replace(/'/g, "\\'")}')">Copy Phone</button>` : ''}
              <button class="btn ${isContacted ? 'btn-outline' : 'btn-success'} btn-sm" onclick="toggleContacted('${lead.id}')">
                ${isContacted ? 'Undo' : 'Mark Contacted'}
              </button>
              ${clean ? `<button class="btn btn-outline btn-sm" style="${isNoWA ? 'background:#7f1d1d;color:#fca5a5;border-color:#7f1d1d;' : ''}" onclick="toggleNoWhatsApp('${lead.id}')">
                ${isNoWA ? 'Has WhatsApp' : 'Mark No WA'}
              </button>` : ''}
              ${lead.url ? `<a href="${lead.url}" target="_blank" class="btn btn-outline btn-sm">Maps</a>` : ''}
              ${hasWebsite ? `<a href="${lead.website.startsWith('http') ? lead.website : 'https://' + lead.website}" target="_blank" class="btn btn-outline btn-sm">Website</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleContacted(id) {
      if (contacted[id]) {
        delete contacted[id];
      } else {
        contacted[id] = true;
      }
      localStorage.setItem('contactedLeads', JSON.stringify(contacted));
      renderLeads();
    }

    function toggleNoWhatsApp(id) {
      if (noWhatsApp[id]) {
        delete noWhatsApp[id];
      } else {
        noWhatsApp[id] = true;
      }
      localStorage.setItem('noWhatsAppLeads', JSON.stringify(noWhatsApp));
      renderLeads();
    }

    function copyPhone(phone) {
      navigator.clipboard.writeText(phone).then(() => {
        alert('Phone copied: ' + phone);
      });
    }

    function clearAll() {
      if (!confirm('Clear all loaded leads?')) return;
      leads = [];
      localStorage.removeItem('savedLeads');
      document.getElementById('jsonInput').value = '';
      renderLeads();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Load saved leads on start
    window.onload = function() {
      const saved = localStorage.getItem('savedLeads');
      if (saved) {
        try {
          leads = JSON.parse(saved);
          renderLeads();
        } catch(e) {}
      }
    };
  </script>
</body>
</html>
